<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pattern Nodes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="pn-style.css">
</head>
<body>
<div id="banner" hidden></div>

<div id="app">
  <header id="bar">
    <span class="logo">Pattern Nodes</span>
    <button class="btn" id="b-add" title="노드 추가 (빈 곳을 우클릭하거나 두 번 클릭해도 돼요)">+ 노드</button>
    <button class="btn" id="b-sample">샘플</button>
    <span class="sep"></span>
    <button class="btn" id="b-undo" title="Ctrl/Cmd + Z">되돌리기</button>
    <button class="btn" id="b-redo" title="Ctrl/Cmd + Shift + Z">다시</button>
    <button class="btn" id="b-fit">전체 보기</button>
    <button class="btn" id="b-clear">비우기</button>
    <span class="grow"></span>
    <label class="hchk" title="끄면 JSON 파일이 훨씬 작아져요. 대신 불러온 뒤 이미지를 다시 올려야 해요"><input type="checkbox" id="b-saveimg" checked><span>이미지 포함</span></label>
    <button class="btn" id="b-save" title="노드 연결과 설정(과 올린 이미지)을 파일로 저장">저장 (.json)</button>
    <button class="btn" id="b-load">불러오기</button>
    <input type="file" id="f-load" accept=".json,application/json" hidden>
  </header>

  <main id="stage">
    <div id="world"><svg id="wires" width="1" height="1"></svg></div>
    <div id="marq" hidden></div>
    <div id="empty" hidden>빈 곳을 우클릭하거나 두 번 클릭해서 노드를 추가해요<br>이미지 파일을 여기에 끌어다 놓아도 돼요</div>
  </main>

  <aside id="viewer">
    <div class="vh"><span id="vtitle">미리보기</span><span id="vinfo"></span></div>
    <canvas id="vcanvas"></canvas>
    <label class="vrow check"><input type="checkbox" id="v-tile"><span>2×2 반복 보기 (이음새 확인)</span></label>
    <label class="vrow check"><input type="checkbox" id="v-trans"><span>배경 투명으로 저장 (출력 노드 설정)</span></label>
    <div class="vrow"><span class="vl vp" id="v-paper"></span></div>
    <div class="vrow"><span class="vl">저장 해상도</span>
      <select id="v-size"><option value="1024">1024px</option><option value="2048" selected>2048px</option><option value="4096">4096px (느려요)</option></select>
    </div>
    <div class="vbtns">
      <button class="btn" id="v-png">PNG 저장</button>
      <button class="btn" id="v-rec" title="이 결과가 어떤 노드를 어떤 설정으로 거쳤는지 글로 저장">기록 저장 (.txt)</button>
    </div>
    <p class="vnote">노드를 클릭하면 그 노드의 결과가 여기 보여요.<br>슬라이더를 움직이는 동안은 작게 계산하고, 놓으면 정확하게 다시 계산해요.</p>
  </aside>
</div>

<div id="toast" hidden></div>

<script src="pn-engine.js"></script>
<script src="pn-nodes.js"></script>
<script src="pn-store.js"></script>
<script src="pn-samples.js"></script>
<script src="pn-editor.js"></script>
<script>
/* 파일을 일부만 올렸을 때 알려 주는 안전장치 */
window.addEventListener('load', function () {
  var PN = window.PN, need = ['engine', 'nodes', 'store', 'samples', 'editor'], bad = [];
  if (!PN) bad = need;
  else need.forEach(function (k) {
    if (!PN.builds || !PN.builds[k]) bad.push(k);
    else if (PN.builds[k] !== PN.builds.editor && PN.builds.editor) bad.push(k);
  });
  if (bad.length || !(PN && PN.app)) {
    var b = document.getElementById('banner');
    b.hidden = false;
    b.textContent = '파일이 빠졌거나 이전 버전이 섞여 있어요 (' + (bad.length ? bad.map(function (k) { return 'pn-' + k + '.js'; }).join(', ') : 'pn-editor.js') + '). pattern.html, pn-style.css, pn-*.js(5개), 총 7개를 모두 같은 폴더에 덮어쓰고 강력 새로고침(Ctrl/Cmd+Shift+R) 해 주세요.';
  }
});
</script>
</body>
</html>
